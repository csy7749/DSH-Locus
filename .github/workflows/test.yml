name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.8', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The Blender tests drive the real add-on, so they need Python; everything
      # else is plain Node. The Unity and host checks need toolchains CI lacks,
      # so they stay opt-in.
      - run: npm test
        env:
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
